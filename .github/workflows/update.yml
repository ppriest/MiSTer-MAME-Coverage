name: Refresh coverage data

on:
  schedule:
    - cron: "0 5 * * *"   # daily, 05:00 UTC: 30 minutes after the ppriest database rebuild (04:30)
  workflow_dispatch:

permissions:
  contents: write

# One refresh at a time; a second run waits instead of racing the first for the push.
concurrency:
  group: refresh-coverage
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache MAME listxml
        uses: actions/cache@v4
        with:
          path: work/cache/mame*
          key: mame-lx-${{ hashFiles('mmc/mame.py') }}
      - name: Week of the year (for the jotego cache)
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      # jotego's repositories are fetched again only once a week (mmc.mister.REFRESH_DAYS): a new week starts from last week's copy
      - name: Cache jotego repositories
        uses: actions/cache@v4
        with:
          path: work/repos/jotego__*
          key: jotego-repos-${{ steps.week.outputs.week }}
          restore-keys: jotego-repos-
      - name: Build and commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            python -m mmc build
            python tools/downloader_databases.py
            git add data docs/data docs/index.html docs/downloader-ini reports
            if git diff --cached --quiet; then echo "no change"; exit 0; fi
            git commit -m "Refresh coverage data"
            if git push; then exit 0; fi
            # main moved while we were building (a merged PR, say): drop our commit, take the
            # new main, and rebuild on top of it. The ledger is append-only, so nothing is lost
            # and the repository checkouts under work/ are untracked and kept.
            echo "push rejected (attempt $attempt); resetting to origin/main and rebuilding"
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
          done
          echo "could not push after 3 attempts" >&2
          exit 1
