name: Refresh coverage data

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays, after alamone's weekly refresh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache MAME listxml
        uses: actions/cache@v4
        with:
          path: work/cache/mame*
          key: mame-lx-${{ hashFiles('mmc/mame.py') }}
      - name: Build
        run: python -m mmc build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && echo "no change" || git commit -m "Refresh coverage data"
          git push
