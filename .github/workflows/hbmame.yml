name: HBMAME listxml

# HBMAME is released as Windows binaries only, so its -listxml is produced here on a Windows
# runner and published as a release asset (hbmame-lx.zip on the hbmame-listxml release) that
# `python -m mmc hbmame` downloads. Runs daily and on demand; does nothing when the newest HBMAME
# build is the one already published.
on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Direct URL of an HBMAME archive (.zip/.7z/.exe), overriding release discovery"
        required: false

permissions:
  contents: write

jobs:
  listxml:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      HBMAME_URL: ${{ inputs.url || vars.HBMAME_URL }}
    steps:
      - name: Find the newest HBMAME build
        id: find
        shell: bash
        run: |
          url="$HBMAME_URL"; src="$HBMAME_URL"
          if [ -z "$url" ]; then
            # The binaries are published at https://hbmame.1emulation.com/ : take the newest archive linked there.
            page=$(curl -sSL -A "Mozilla/5.0" https://hbmame.1emulation.com/ || true)
            url=$(printf '%s' "$page" | grep -oiE 'href="[^"]+\.(zip|7z|exe)"' | sed -E 's/^href="//I; s/"$//' \
                  | grep -i 'hbmame' | grep -viE 'hbmameui|mameui|source|src|32' | sort -V | tail -1 || true)
            case "$url" in
              "") ;;
              http*) ;;
              /*) url="https://hbmame.1emulation.com$url" ;;
              *) url="https://hbmame.1emulation.com/$url" ;;
            esac
            src="$url"
          fi
          if [ -z "$url" ]; then
            tag=$(gh api repos/Robbbert/hbmame/releases/latest --jq .tag_name 2>/dev/null || true)
            if [ -n "$tag" ]; then
              url=$(gh api repos/Robbbert/hbmame/releases/latest --jq '[.assets[] | select(.name | test("64|x64"; "i")) | select(.name | test("\\.(zip|7z|exe)$"; "i"))][0].browser_download_url' 2>/dev/null || true)
              src="$tag"
            fi
          fi
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "No HBMAME archive found on hbmame.1emulation.com or in the GitHub releases. Set the HBMAME_URL repository variable or run with the url input." >&2
            exit 1
          fi
          current=$(gh release view hbmame-listxml --repo "${{ github.repository }}" --json body --jq .body 2>/dev/null || true)
          if [ "$current" = "source: $url" ] && [ -z "${{ inputs.url }}" ]; then
            echo "Already published for $url"; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "url=$url" >> "$GITHUB_OUTPUT"; echo "src=$src" >> "$GITHUB_OUTPUT"
          fi
      - name: Download and extract
        if: steps.find.outputs.skip != 'true'
        shell: bash
        run: |
          mkdir hb && cd hb
          curl -sSL -o hbmame.pkg "${{ steps.find.outputs.url }}"
          7z x -y hbmame.pkg > /dev/null || cp hbmame.pkg hbmame.exe
          ls
      - name: Run -listxml
        if: steps.find.outputs.skip != 'true'
        shell: bash
        run: |
          cd hb
          exe=$(find . -iname 'hbmame*.exe' | head -1)
          echo "Using $exe"
          "$exe" -listxml > hbmame.xml
          head -c 300 hbmame.xml; echo
          7z a -tzip ../hbmame-lx.zip hbmame.xml > /dev/null
      - name: Publish release asset
        if: steps.find.outputs.skip != 'true'
        shell: bash
        run: |
          gh release view hbmame-listxml --repo "${{ github.repository }}" > /dev/null 2>&1 || \
            gh release create hbmame-listxml --repo "${{ github.repository }}" --title "HBMAME listxml" --notes "pending"
          gh release upload hbmame-listxml hbmame-lx.zip --clobber --repo "${{ github.repository }}"
          gh release edit hbmame-listxml --repo "${{ github.repository }}" --notes "source: ${{ steps.find.outputs.url }}"
